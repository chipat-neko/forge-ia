name: Site

# Les tests tournent sur chaque push vers main et sur chaque pull request.
# Le déploiement sur GitHub Pages n'a lieu que pour un push vers main, une
# fois les tests passés.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Tests unitaires (vitest)
        run: npx vitest run
      - name: Navigateur de Playwright
        run: npx playwright install --with-deps chromium
      # Playwright construit le site avec les pages d'essai et le sert lui-même
      # (voir webServer dans site/playwright.config.ts).
      - name: Parcours de test (Playwright)
        run: npx playwright test
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: site/playwright-report/
          retention-days: 14

  deploiement:
    name: Déploiement sur GitHub Pages
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Installation
        run: npm ci
        working-directory: site
      # Sans FORGE_ESSAIS : les pages d'essai ne sont pas publiées.
      - name: Construction du site
        run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Publication
        id: deploiement
        uses: actions/deploy-pages@v5
