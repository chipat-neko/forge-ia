name: Site

# Les tests tournent sur chaque push vers main et sur chaque pull request.
# Pour un push vers main, une fois les tests passés, le site est construit
# par un job sans aucun droit sur GitHub Pages, puis publié par un job qui ne
# fait que ça : le seul à détenir pages:write et id-token:write, il n'installe
# ni n'exécute aucun paquet npm.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Vitest ne vérifie pas les types : sans ces deux étapes, une erreur de type passerait
      # tous les tests. astro check lit les fichiers .astro et .ts ; il écarte les composants
      # .svelte (son serveur de langage les filtre), que svelte-check vérifie à sa place,
      # avertissements d'accessibilité compris.
      - name: Vérification des types (astro check)
        run: npx astro check
      - name: Vérification des composants Svelte (svelte-check)
        run: npm run check:svelte
      - name: Tests unitaires (vitest)
        run: npx vitest run
      # Firefox et WebKit ne servent qu'au parcours de parité (e2e/parite.spec.ts) :
      # la page d'essai y refait tous les attendus du Python, au bit près.
      - name: Navigateurs de Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      # Playwright construit le site avec les pages d'essai et le sert lui-même
      # (voir webServer dans site/playwright.config.ts). FORGE_TOUS_NAVIGATEURS
      # ajoute les projets parite-firefox et parite-webkit.
      - name: Parcours de test (Playwright)
        run: npx playwright test
        env:
          FORGE_TOUS_NAVIGATEURS: '1'
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: site/playwright-report/
          retention-days: 14

  construction:
    name: Construction du site
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Installation
        run: npm ci
      # Sans FORGE_ESSAIS : les pages d'essai ne sont pas publiées.
      - name: Construction du site
        run: npm run build
      # Garde-fou : rien des pages d'essai dans le site publié. Ni leur dossier, ni la liste des
      # prénoms, qu'aucune page publiée ne montre encore. On cherche un prénom distinctif, choisi
      # comme dans e2e/mini-modele.spec.ts : le premier d'au moins 7 lettres à partir du milieu de
      # la liste. Ce contrôle ne vaut que pour le site publié (construit sans FORGE_ESSAIS) : une
      # construction avec les pages d'essai contient aussi ce prénom, dans le Worker du mini-modèle
      # (travailleur-*.js) et dans la page de parité (ControleParite.*.js).
      # Quand le plan 5 publiera une page avec le mini-modèle, son Worker entrera dans le site :
      # il faudra alors écarter dist/_astro/travailleur-*.js de la recherche du prénom (par exemple
      # grep --exclude='travailleur-*.js'), en gardant la vérification de dist/essais.
      - name: Aucune page d'essai dans le site construit
        run: |
          if [ -e dist/essais ]; then
            echo "dist/essais existe : une page d'essai entrerait dans le site publié. Elles ne se construisent qu'avec FORGE_ESSAIS=1." >&2
            exit 1
          fi
          test -d dist/_astro || { echo "dist/_astro est introuvable : la construction a-t-elle changé de dossier ?" >&2; exit 1; }
          liste=../projets/mini-modele/donnees/prenoms.txt
          total=$(grep -c . "$liste")
          prenom=$(grep . "$liste" | tail -n +$((total / 2 + 1)) | LC_ALL=C.UTF-8 grep -m1 -E '^.{7,}$')
          test -n "$prenom" || { echo "Aucun prénom d'au moins 7 lettres dans la seconde moitié de $liste." >&2; exit 1; }
          if grep -rlF -- "$prenom" dist/_astro; then
            echo "Le prénom « $prenom » est dans les fichiers ci-dessus : la liste des prénoms entrerait dans le site publié." >&2
            exit 1
          fi
          echo "Aucune page d'essai ni la liste des prénoms dans dist/ (prénom cherché : $prenom)."
      # Garde-fou : aucun brouillon de chapitre (src/brouillons/chapitres/<p>-<n>.mdx) dans le site
      # publié. Un brouillon ne se construit qu'avec FORGE_ESSAIS=1 ; pour paraître, il passe dans
      # src/content/chapitres/ (voir « Parution d'un chapitre » dans le README). Sans brouillon,
      # la boucle ne fait rien.
      - name: Aucun brouillon de chapitre dans le site construit
        run: |
          for f in src/brouillons/chapitres/*.mdx; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .mdx); p=${n%%-*}
            if [ -e "dist/partie-$p/$n" ]; then
              echo "dist/partie-$p/$n existe : le brouillon $f entrerait dans le site publié." >&2; exit 1
            fi
          done
          echo "Aucun brouillon de chapitre dans dist/."
      - name: Dépôt du site construit pour la publication
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploiement:
    name: Déploiement sur GitHub Pages
    needs: construction
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publication
        id: deploiement
        uses: actions/deploy-pages@v5
