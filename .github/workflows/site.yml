name: Site

# Les tests tournent sur chaque push vers main et sur chaque pull request.
# Pour un push vers main, une fois les tests passés, le site est construit
# par un job sans aucun droit sur GitHub Pages, puis publié par un job qui ne
# fait que ça : le seul à détenir pages:write et id-token:write, il n'installe
# ni n'exécute aucun paquet npm.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Vitest ne vérifie pas les types : sans cette étape, une erreur de type passerait
      # tous les tests. astro check lit aussi les composants .astro et .svelte.
      - name: Vérification des types (astro check)
        run: npx astro check
      - name: Tests unitaires (vitest)
        run: npx vitest run
      # Firefox et WebKit ne servent qu'au parcours de parité (e2e/parite.spec.ts) :
      # la page d'essai y refait tous les attendus du Python, au bit près.
      - name: Navigateurs de Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      # Playwright construit le site avec les pages d'essai et le sert lui-même
      # (voir webServer dans site/playwright.config.ts). FORGE_TOUS_NAVIGATEURS
      # ajoute les projets parite-firefox et parite-webkit.
      - name: Parcours de test (Playwright)
        run: npx playwright test
        env:
          FORGE_TOUS_NAVIGATEURS: '1'
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: site/playwright-report/
          retention-days: 14

  construction:
    name: Construction du site
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Installation
        run: npm ci
      # Sans FORGE_ESSAIS : les pages d'essai ne sont pas publiées.
      - name: Construction du site
        run: npm run build
      - name: Dépôt du site construit pour la publication
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploiement:
    name: Déploiement sur GitHub Pages
    needs: construction
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publication
        id: deploiement
        uses: actions/deploy-pages@v5
