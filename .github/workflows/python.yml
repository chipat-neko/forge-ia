name: Python

# Les tests des projets Python (et l'exécution des notebooks qui les
# accompagnent) tournent sous Linux et sous Windows, comme chez les lecteurs.
# Le job notebooks-colab exécute en plus chaque notebook comme sur Colab sans
# carte graphique (Python 3.13, PyTorch 2.14.1 pour processeur).
on:
  push:
    paths:
      - 'projets/**'
      - 'notebooks/**'
      - 'outils/**'
      # Les tests de forge relisent la documentation des sources.
      - 'docs/donnees.md'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'projets/**'
      - 'notebooks/**'
      - 'outils/**'
      # Les tests de forge relisent la documentation des sources.
      - 'docs/donnees.md'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Tests de chaque projet
        shell: bash
        run: |
          echec=0
          nombre=0
          for dossier in projets/*/; do
            [ -f "${dossier}pyproject.toml" ] || continue
            # forge a son propre job (plus bas) : ses tests prennent l'essentiel du temps.
            [ "$dossier" = "projets/forge/" ] && continue
            nombre=$((nombre + 1))
            echo "::group::${dossier}"
            # --locked : échoue si uv.lock ne correspond plus à pyproject.toml.
            # Un projet qui déclare l'extra « cpu » (PyTorch en deux versions,
            # carte graphique ou processeur) est testé avec les roues CPU :
            # les machines de l'intégration continue n'ont pas de carte NVIDIA.
            options=""
            if grep -Eq '^cpu[[:space:]]*=' "${dossier}pyproject.toml"; then
              options="--extra cpu"
            fi
            if ! (cd "$dossier" && uv run --locked $options pytest -q); then
              echo "::error::Tests en échec dans ${dossier}"
              echec=1
            fi
            echo "::endgroup::"
          done
          if [ "$nombre" -eq 0 ]; then
            echo "::error::Aucun projet Python trouvé dans projets/"
            exit 1
          fi
          exit "$echec"

  # forge (le moteur de ton IA) dans son propre job, avec son propre délai : ses tests prenaient
  # 3 min 16 s des 11 min 30 s du job Windows ci-dessus (relevé le 15/11/2026), et ils vont grandir.
  # --durations=15 liste les 15 tests les plus lents, pour voir venir un dépassement.
  forge:
    name: Tests de forge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      # --locked : échoue si uv.lock ne correspond plus à pyproject.toml. Les roues CPU de
      # PyTorch : les machines de l'intégration continue n'ont pas de carte NVIDIA.
      - name: Tests de forge
        shell: bash
        working-directory: projets/forge
        run: uv run --locked --extra cpu pytest -q --durations=15

  # Chaque notebook, exécuté dans un environnement qui reproduit l'image de Colab sans
  # carte graphique (relue le 05/11/2026, https://github.com/googlecolab/backend-info) :
  # Python 3.13, torch 2.14.1 pour processeur (de l'index de PyTorch, pas de PyPI), puis
  # numpy, le noyau et pytest de Colab (outils/colab-sans-carte.txt). La carte de Colab,
  # elle, n'est pas testée. Les mêmes commandes se lancent en local : voir « Notebooks »
  # dans le README. Les tests d'outils/ (l'exécuteur des notebooks) tournent avant.
  # Les notebooks font écrire une version publiée de ton IA (une Release, environ 830 Mo chacune) :
  # 1.5 et 1.6 la Release ton-ia-1.5, les suivants celle de leur étape. Les Releases à prendre sont
  # listées dans outils/versions-publiees.txt (une étiquette par ligne ; une étiquette y entre à la
  # parution de son chapitre). Elles sont téléchargées une fois, gardées en cache sous la clé du fichier
  # (une étiquette de plus, c'est un nouveau cache), et données aux notebooks par FORGE_IA_MODELES (le
  # dossier qui les contient, une par sous-dossier) ; FORGE_IA_MODELE reste le dossier de ton-ia-1.5
  # pour 1.5 et 1.6 (sans elles, les notebooks s'arrêtent).
  notebooks-colab:
    name: Notebooks comme sur Colab, sans carte
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Environnement de Colab sans carte (.colab)
        run: |
          uv venv --python 3.13 .colab
          uv pip install --python .colab --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          uv pip install --python .colab -r outils/colab-sans-carte.txt
      - name: Tests de l'exécuteur des notebooks
        run: .colab/bin/python -m pytest -q outils
      # La clé suit le contenu de la liste : une étiquette de plus donne un nouveau cache.
      - name: Versions publiées de ton IA, depuis le cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/versions
          key: versions-${{ hashFiles('outils/versions-publiees.txt') }}
      # Chaque étiquette de la liste dont le dossier manque est téléchargée. Les lignes vides sont sautées.
      - name: Téléchargement des versions publiées de ton IA qui manquent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/versions"
          while IFS= read -r etiquette || [ -n "$etiquette" ]; do
            etiquette=${etiquette%$'\r'}
            [ -n "$etiquette" ] || continue
            if [ -n "$(ls -A "$RUNNER_TEMP/versions/$etiquette" 2>/dev/null)" ]; then
              echo "$etiquette : déjà dans le cache."
              continue
            fi
            gh release download "$etiquette" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/versions/$etiquette"
          done < outils/versions-publiees.txt
      - name: Exécution des notebooks
        env:
          FORGE_IA_MODELES: ${{ runner.temp }}/versions
          FORGE_IA_MODELE: ${{ runner.temp }}/versions/ton-ia-1.5
        run: .colab/bin/python outils/executer_notebooks.py
