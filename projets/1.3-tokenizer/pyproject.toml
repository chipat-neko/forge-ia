[project]
name = "tokenizer-pedagogique"
version = "0.1.0"
description = "Un tokenizer BPE minuscule, écrit pour comprendre comment une IA découpe un texte."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "regex>=2024.1.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenizer_pedagogique"]

[tool.pytest.ini_options]
testpaths = ["tests"]
