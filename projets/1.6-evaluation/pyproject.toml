[project]
name = "evaluation-pas-a-pas"
version = "0.1.0"
description = "L'évaluation de « ton IA » pas à pas : la perte, la perplexité, les bits par octet, un QCM noté sans que le modèle écrive un mot, la marge et le verdict, refaits à la main et comparés à forge ; le résumé de l'évaluation de « mini », des QCM MMMLU notés, et les cartes d'attention : le Python du chapitre 1.6."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Le projet refait à la main les mesures de forge, le moteur de « ton IA » (dépendance par chemin),
# et lit le rapport de son évaluation. numpy : PyTorch le cherche à son import, et prévient sans lui
# (« Failed to initialize NumPy »). Le jeu MMMLU est lu en flux avec `datasets`, que forge apporte.
dependencies = [
    "forge-ia",
    "numpy>=2.0",
]

# region: pytorch
# PyTorch n'est pas une dépendance ordinaire : il vient d'un index différent
# selon l'extra choisi (voir [tool.uv.sources]), et les deux extras ne peuvent
# pas être installés ensemble.
#   uv run --extra gpu …   carte NVIDIA (roues CUDA 13.2)
#   uv run --extra cpu …   sans carte graphique (processeur seul)
[project.optional-dependencies]
gpu = ["torch==2.15.0"]
cpu = ["torch==2.15.0"]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
forge-ia = { path = "../forge", editable = true }
torch = [
    { index = "pytorch-cu132", extra = "gpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
# fin: pytorch

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation_pas_a_pas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test qui a besoin de la carte graphique (sauté quand CUDA est absente)",
]
# Sous Windows, pyzmq (le lien entre nbclient et le noyau du notebook) prévient qu'il
# ajoute un fil pour la boucle Proactor d'asyncio : sans effet sur les tests. Seul cet
# avertissement est masqué.
filterwarnings = [
    "ignore:Proactor event loop does not implement add_reader family of methods required for zmq:RuntimeWarning",
]
