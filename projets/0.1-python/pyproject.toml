[project]
name = "mot-suivant"
version = "0.1.0"
description = "Compter quel mot suit quel autre dans un texte, puis deviner le mot suivant : le Python du chapitre 0.1."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mot_suivant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
