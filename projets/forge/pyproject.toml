[project]
name = "forge-ia"
version = "0.1.0"
description = "Le moteur de « ton IA » : données, tokenizer, entraînement et évaluation d'un petit modèle de langage qui lit et écrit le français et le code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "datasets>=4.0",
    "numpy>=2.0",
    "psutil>=6.0",
    "regex>=2024.1.1",
    "safetensors>=0.5",
    "tomli-w>=1.0",
]

# PyTorch n'est pas une dépendance ordinaire : il vient d'un index différent
# selon l'extra choisi (voir [tool.uv.sources]), et les deux extras ne peuvent
# pas être installés ensemble.
#   uv run --extra gpu …   carte NVIDIA (roues CUDA 13.2)
#   uv run --extra cpu …   sans carte graphique (intégration continue)
[project.optional-dependencies]
gpu = ["torch==2.15.0"]
cpu = ["torch==2.15.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.uv]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "gpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test qui a besoin de la carte graphique (sauté quand CUDA est absente)",
]
