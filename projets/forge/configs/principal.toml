# Entraînement principal de ton IA (preset « tres_grand », environ 135 heures sur la carte graphique).
#
# Choix de l'utilisateur le 3 novembre 2026, d'après la mesure de docs/mesures/entrainement-2026-11.md :
# la carte graphique (RTX 5070 Ti, 17 855 jetons par seconde pour cette taille, 76 fois le processeur
# sur ses 16 fils) et la taille « tres_grand ».
#
# Lancer, depuis projets/forge (après « . .\outils\env-forge.ps1 » à la racine du dépôt) :
#   uv run --extra gpu python -m forge entrainer --config configs/principal.toml
# Ctrl+C met en pause (le pas en cours se termine, puis tout est sauvegardé) ; pour reprendre :
#   uv run --extra gpu python -m forge entrainer --config configs/principal.toml --reprendre

# Taille du modèle : « tres_grand » = 433,6 millions de paramètres (dim 1280, 20 couches,
# 20 têtes), contexte de 2 048 jetons.
preset = "tres_grand"

# Dossier des jetons, celui de « forge encoder --donnees principal » (sous FORGE_DONNEES/jetons/).
donnees = "principal"

# Jetons lus en tout : 20 par paramètre (20 × 433 573 120 = 8 671 462 400), arrondis au pas
# entier au-dessus : 16 540 pas de 524 288 jetons = 8 671 723 520 jetons.
jetons_total = 8_671_723_520

# Jetons vus par pas d'optimisation : 256 lignes de 2 048 jetons, le lot habituel des modèles de
# cette taille (GPT-3 350M, Pythia 410M). Doit être un multiple de micro_lot × 2 048.
taille_lot_jetons = 524_288

# Lignes de 2 048 jetons que la carte traite d'un coup : 1, le seul micro-lot qui tient pour cette
# taille (10,9 Go de mémoire au plus), donc 256 micro-lots accumulés par pas.
micro_lot = 1

# Taux d'apprentissage : montée de 0 à 0,0004 pendant les 500 premiers pas (3 % de
# l'entraînement), puis descente en cosinus jusqu'à 0,00004 au dernier pas. 0,0004 se place entre
# Pythia 410M (0,0003) et les petits modèles récents (0,0006) : un peu prudent, car une divergence
# coûterait des heures de carte.
taux_max = 4e-4
echauffement = 500

# Réglages d'AdamW et écrêtage des gradients (valeurs habituelles des modèles de langage).
poids_decroissance = 0.1
betas = [0.9, 0.95]
ecretage = 1.0

# Graine du hasard : poids de départ et ordre des données.
graine = 1234

# Perte de validation tous les 200 pas (environ 1 h 40) : 83 points sur la courbe.
evaluation_tous_pas = 200

# Sauvegarde au moins toutes les 30 minutes. Une sauvegarde d'étape pèse 5,2 Go (12 octets par
# paramètre) : plus souvent userait le SSD pour rien, plus rarement ferait perdre plus de calcul
# après une coupure de courant. Ctrl+C sauvegarde tout de suite, quelle que soit cette valeur.
sauvegarde_minutes = 30

# « cuda » : la carte graphique (RTX 5070 Ti). « cpu » : le processeur, bien plus lent.
appareil = "cuda"

# « auto » : essayer torch.compile, et continuer sans s'il ne marche pas (triton manque sous Windows).
compiler = "auto"

# Dossier du journal et des sauvegardes (sous FORGE_DONNEES/entrainements/).
sortie = "ton-ia"
